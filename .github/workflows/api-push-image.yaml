name: API Push Image to Docker Hub

on: 
  push:
    branches: [master]

env:
  IMAGE_NAME: capg
  IMAGE_VERSION: '0.0.5'

jobs:
  # build-and-test:
  #   name: Build & Run Tests
  #   uses: ./.github/workflows/build-and-test.yaml
  #   with:
  #     dotnet-version: '10.0.x'

  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    # needs: build-and-test
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: Checkout GitHub Code
      #   uses: actions/checkout@v7

      - name: Debug workspace
        run: |
          ls -la ./capg-backend-api/
          echo "---"
          head -5 ./capg-backend-api/Dockerfile

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./capg-backend-api
          file: ./capg-backend-api/Dockerfile
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}