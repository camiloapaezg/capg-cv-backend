name: API Push Image to Docker Hub

on: 
  push:
    branches: [master]

env:
  IMAGE_NAME: capg
  IMAGE_VERSION: '0.0.5'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Build & Run Tests
        uses: ./.github/workflows/build-and-test.yaml@master
        with:
          dotnet-version: '10.0.x'

  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./capg-backend-api/Dockerfile
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}