name: Build & Publish

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Cache NPM Packages
        uses: actions/cache@v6
        id: cache-npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Check Cache Status
        run: |
          if [ "${{ steps.cache-npm.outputs.cache-hit }}" == "true" ]; then
            echo "Cache FOUND - Cached dependencies will be used"
          else
            echo "Cache NOT FOUND - NPM packages will be cached after install"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Package
        run: npm run build

      - name: Check Built
        run: npm pack --dry-run

      - name: Publish to NPM
        run: npm publish --access public
